name: Daily brand data refresh

on:
  schedule:
    # 03:30 UTC = 09:00 IST
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated brand slugs to refresh (leave blank for all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh tracked brands
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            npm run refresh -- --only=${{ github.event.inputs.only }}
          else
            npm run refresh
          fi

      - name: Commit and push updated brand data
        run: |
          git config user.name "wldd-revtracker-bot"
          git config user.email "actions@github.com"
          git add data/brands data/api-spend-log.json
          if git diff --cached --quiet; then
            echo "No brand data changes to commit."
          else
            git commit -m "chore: daily brand data refresh"
            git push
          fi

      - name: Trigger Vercel redeploy
        if: ${{ vars.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ vars.VERCEL_DEPLOY_HOOK_URL }}"
